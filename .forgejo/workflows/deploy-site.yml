# Forgejo Actions deploy pipeline for the mcpmemory.services landing page.
#
# Why this exists: Cloudflare Pages has no git integration for Codeberg, so the
# site must be pushed via wrangler (direct upload). Previously this was a manual
# step (with a PTY/OAuth workaround); this workflow automates it with an API
# token, which wrangler accepts non-interactively.
#
# Trigger: any push to main that touches site/** (e.g. the release PR bumping
# version strings in site/index.html), or manual workflow_dispatch.
#
# Action refs are BARE (`actions/checkout@v4`) — resolve via Codeberg's action
# mirror, never github.com (the runner box has github.com poisoned; see
# release.yml header for the full story).
#
# Required repo secrets (Codeberg -> Settings -> Actions -> Secrets):
#   CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages: Edit" permission
#                          (Account-level; NOT the D1/Vectorize token from .env)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#
# Runner: self-hosted forgejo-runner on Hetzner (tinyclaw), label "docker".

name: Deploy Site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    name: wrangler pages deploy
    timeout-minutes: 15

    steps:
    - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Deploy site/ to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        node --version
        npx --yes wrangler@4 pages deploy site \
          --project-name mcpmemory-services \
          --branch main \
          --commit-dirty=true

    - name: Verify deployed version
      run: |
        sleep 10
        expected=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' site/index.html | head -1)
        live=$(node -e "fetch('https://mcpmemory-services.pages.dev').then(r=>r.text()).then(t=>console.log((t.match(/<title>[^<]*(v[0-9]+\.[0-9]+\.[0-9]+)/)||[,'unknown'])[1]))")
        echo "expected=$expected live=$live"
        [ "$expected" = "$live" ] || { echo "::warning::live version ($live) != expected ($expected) — CDN cache may lag"; }
