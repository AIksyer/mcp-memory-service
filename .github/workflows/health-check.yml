name: R2 Health Check

on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: R2 bucket health check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          echo "=== R2 Health Check ==="
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          # 1. Verify bucket exists
          BUCKET_INFO=$(curl -s \
            -X GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/$R2_BUCKET" \
            -H "Authorization: Bearer $CF_API_TOKEN")

          SUCCESS=$(echo "$BUCKET_INFO" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Bucket $R2_BUCKET not accessible"
            echo "$BUCKET_INFO" | jq .
            exit 1
          fi

          echo "✅ Bucket: $R2_BUCKET"
          echo "   Created: $(echo "$BUCKET_INFO" | jq -r '.result.creation_date')"
          echo "   Location: $(echo "$BUCKET_INFO" | jq -r '.result.location')"

          # 2. Check usage
          USAGE=$(curl -s \
            -X GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/$R2_BUCKET/usage" \
            -H "Authorization: Bearer $CF_API_TOKEN")

          PAYLOAD_SIZE=$(echo "$USAGE" | jq -r '.result.payloadSize // "0"')
          OBJECT_COUNT=$(echo "$USAGE" | jq -r '.result.objectCount // "0"')
          UPLOAD_COUNT=$(echo "$USAGE" | jq -r '.result.uploadCount // "0"')
          echo ""
          echo "=== Usage ==="
          echo "   Objects: $OBJECT_COUNT"
          echo "   Payload: $PAYLOAD_SIZE bytes"
          echo "   Uploads (this period): $UPLOAD_COUNT"

          # 3. Free tier check — alert at 80% (20% headroom remaining)
          # R2 free tier: 10GB storage, 1M Class A ops/month, 10M Class B ops/month
          echo ""
          echo "=== Free Tier Status (alert at 80%) ==="
          STORAGE_THRESHOLD=8589934592    # 8GB = 80% of 10GB
          CLASS_A_THRESHOLD=800000        # 80% of 1M
          CLASS_B_THRESHOLD=8000000       # 80% of 10M

          PAYLOAD_GB=$(echo "scale=2; $PAYLOAD_SIZE / 1073741824" | bc 2>/dev/null || echo "0")
          WARNING=0

          if [ "$PAYLOAD_SIZE" -ge "$STORAGE_THRESHOLD" ]; then
            echo "⚠️  Storage: ${PAYLOAD_GB}GB / 10GB — reached 80% threshold!"
            WARNING=1
          else
            echo "✅ Storage: ${PAYLOAD_GB}GB / 10GB (under 80%)"
          fi

          if [ "$UPLOAD_COUNT" -ge "$CLASS_A_THRESHOLD" ]; then
            echo "⚠️  Class A ops: $UPLOAD_COUNT / 1M — reached 80% threshold!"
            WARNING=1
          else
            echo "✅ Class A ops: $UPLOAD_COUNT / 1M (under 80%)"
          fi

          if [ "$WARNING" -eq 1 ]; then
            echo ""
            echo "⚠️  Free tier 80% threshold reached — 20% headroom remaining."
            echo "⚠️  No auto-deletion is configured. Backups are preserved indefinitely."
            echo "⚠️  Please review old backups manually if cleanup is needed."
            exit 1
          fi

          echo ""
          echo "✅ Health check complete — all within free tier"

      - name: Create issue on threshold warning
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ R2 Free Tier 80% Threshold Reached',
              body: 'R2 usage has reached 80% of the free tier limit. Only 20% headroom remains.\n\n' +
                    'No auto-deletion is configured — backups are preserved indefinitely.\n' +
                    'Please review old backups manually if cleanup is needed.\n\n' +
                    'Check: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['backup', 'alert']
            });
