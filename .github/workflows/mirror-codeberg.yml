name: Mirror from Codeberg

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone from Codeberg and push to GitHub
        run: |
          set -euo pipefail
          echo "=== Mirroring Codeberg -> GitHub ==="

          git config --global user.name "GitHub Actions Mirror Bot"
          git config --global user.email "actions@github.com"

          # Clone from Codeberg
          git clone --bare https://codeberg.org/doobidoo/mcp-memory-service.git /tmp/mirror
          cd /tmp/mirror

          # Push all branches and tags
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

          echo "✅ Mirror complete"
